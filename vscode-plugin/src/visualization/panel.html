<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'unsafe-inline';"
        />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>NeoJoin Preview</title>
        <style>
            html,
            body {
                width: 100%;
                height: 100%;
                padding: 0;
                margin: 0;
                display: flex;
                flex-direction: column;
                align-items: stretch;
            }

            #status {
                padding: 0.5em;

                display: flex;
                align-items: center;

                form {
                    display: inline-flex;
                    align-items: center;

                    label {
                        display: inline-flex;
                        align-items: center;
                        margin-left: 0.5em;

                        cursor: help;
                        text-decoration: dotted underline;
                        text-underline-offset: 2px;
                    }
                }

                background: color-mix(
                    in srgb,
                    var(--vscode-badge-background),
                    transparent 50%
                );

                &.warning {
                    background: rgba(255, 204, 0, 0.4);
                }

                &.error {
                    background: rgba(255, 0, 0, 0.3);
                }

                #message {
                    flex: 1;
                    margin: 0 1.5em;
                    text-align: center;

                    color: var(--vscode-editor-foreground);
                }
            }

            #visualization_outer {
                flex:1 1 auto;
                min-height:0;
                min-width:0;
                overflow:hidden;
                display:flex;
                justify-content:center;
                align-items:center;
            }

            #visualization {
                width: 100%;
                height: 100%;
                flex: 1 1 auto;
                overflow: auto;
                min-height: 0;
                min-width: 0;
                display: flex;
                justify-content: safe center;
                align-items: safe center;

                > svg {
                    flex: none;
                }

                > svg,
                > svg > g > rect {
                    background: transparent !important;
                    fill: none !important;
                }
            }

            /* Fix font color of <<enumeration>> in dark mode */
            .vscode-dark #visualization > svg text[font-style="italic"] {
                fill: white;
            }

            .zoom-ui {
                height: 1.4em;
                /* vertical-align: middle; */
            }

            .zoom-btn {
                background-color: transparent;
                border: none;
                padding: 0;
                color: white;
                font-size: 1.6em;
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <div id="status">
            <form id="options">
                Mode:
                <label
                    title="Show all classes of the target model as well as all classes of the source models"
                >
                    <input type="radio" name="mode" value="full" />
                    <span>Full</span>
                </label>

                <label
                    title="Show all classes of the target model as well as all referenced classes of the source models"
                >
                    <input type="radio" name="mode" value="referenced" />
                    <span>Referenced</span>
                </label>

                <label
                    title="Show the target class produced by the queries overlapping with the cursor text selection as well as all referenced classes of the source models"
                >
                    <input type="radio" name="mode" value="selected" />
                    <span>Selected</span>
                </label>

                <label title="Draw orthogonal arrows">
                    <input type="checkbox" name="orthogonal" />
                    <span>Orthogonal</span>
                </label>
            </form>
            <span id="message">Loading ...</span>
            <span>
                Zoom:
                <button onclick="zoomHandler.zoomOut()" class="zoom-ui zoom-btn">-</button>
                <button onclick="zoomHandler.zoomIn()" class="zoom-ui zoom-btn">+</button>
                <select id="zoom_dropdown" class="zoom-ui">
                </select>
                <button onclick="zoomHandler.autoZoom()" class="zoom-ui" type="button">auto</button>
            </span>
        </div>
        <div id="visualization_outer">
            <div id="visualization"></div>
        </div>
        <script>
            const vscode = acquireVsCodeApi();
            const state = {
                uri: "%URI%",
                options: {
                    mode: "%MODE%",
                    orthogonal: %ORTHOGONAL%,
                },
            };
            vscode.setState(state);

            // persist option changes + notify extension
            const options = document.getElementById("options");
            options.addEventListener("change", (event) => {
                const option = event.target.name;
                const newValue =
                    event.target.type === "checkbox"
                        ? event.target.checked
                        : event.target.value;
                state.options[option] = newValue;
                vscode.setState(state);

                vscode.postMessage({
                    command: "option",
                    option: option,
                    value: newValue,
                });
            });

            // handle updates from extension
            const status = document.getElementById("status");
            const message = document.getElementById("message");
            const visualization = document.getElementById("visualization");
            const statusClassFor = {
                ok: "",
                warning: "warning",
                error: "error",
            }
            function update(data) {
                status.className = statusClassFor[data.type];
                message.innerText = data.message;

                if (data.svg) {
                    visualization.innerHTML = data.svg;
                    zoomHandler.autoZoom();
                }
            }
            window.addEventListener("message", (event) => update(event.data));

            // restore previous settings
            function restore(selector, apply) {
                const input = document.querySelector(selector);
                if (input) {
                    apply(input);
                }
            }
            restore(
                `#options input[name="mode"][value="${state.options.mode}"]`,
                (input) => input.checked = true
            );
            restore(
                `#options input[name="orthogonal"]`,
                (input) => input.checked = state.options.orthogonal
            );

        class Visualization {
            get #visualization() {
                return document.getElementById("visualization")
            }

            get svg() {
                return this.#visualization.querySelector("svg");
            }

            get svgBox() {
                return this.svg.getBBox()
            }

            get outer() {
                return document.getElementById("visualization_outer");
            }

            get viewRect() {
                return  this.outer.getBoundingClientRect()
            }

            scale_svg(factor) {
                const svg = this.svg
                if (!svg) {
                    requestAnimationFrame(() => this.scale_svg(factor));
                    return;
                }

                // use width/height instead of `transform: scale(...)` to avoid issues with scrollbars
                const svgSize = svg.getBBox();
                svg.style.width = `${svgSize.width * factor}px`;
                svg.style.height = `${svgSize.height * factor}px`;
            }

            set scrollX(x) {
                this.#visualization.scrollLeft = x
            }

            get scrollX() {
                return this.#visualization.scrollLeft
            }

            set scrollY(y) {
                this.#visualization.scrollTop = y
            }

            get scrollY() {
                return this.#visualization.scrollTop
            }

            get scrollWidth() {
                return this.#visualization.scrollWidth
            }

            get scrollHeight() {
                return this.#visualization.scrollHeight
            }
        }

        class PanelZoomHandler {
            #zoomDropdown = document.getElementById('zoom_dropdown')
            #visualization = new Visualization()

            #zoomConfig

            // The index into zoomLevels describing the currently selected value.
            #selectedZoomIdx
            #zoomLevels

            constructor() {
                this.#zoomConfig = new ZoomConfig({
                    // defaultZoomLevelStartIdx/defaultZoomLevelEndIdx describe which zoom levels are displayed inside the zoom picker by default.
                    defaultZoomLevelStartIdx: 21,
                    defaultZoomLevelEndIdx: 21 + 15,

                    // under the current configuration zoomIdx == 21 + 10 is equivalent to zoom factor 1.0
                    defaultZoomIdx: 21 + 10,

                    // pairs of inclusive lower boundary to zoom step
                    steps: [
                        [0.0, 0.02],
                        [0.4, 0.05],
                        [1.2, 0.1],
                        [1.75, 0.25],
                        [3.0, 0.5],
                        [4.0, 1.0],
                        [5.0, 1.5],
                    ],
                });

                this.#zoomLevels = new ZoomLevels(this.#zoomConfig)

                this.#selectedZoomIdx = this.#zoomConfig.defaultZoomIdx;

                this.#initiateZoomDropdown()
            }

            #initiateZoomDropdown() {
                for (let i = this.#zoomConfig.defaultZoomLevelStartIdx; i <= this.#zoomConfig.defaultZoomLevelEndIdx; i++) {
                    this.#zoomDropdown.appendChild(create_option(this.#zoomLevels.get(i)));
                }
                this.#zoomDropdown.selectedIndex = this.#selectedZoomIdx - this.#zoomConfig.defaultZoomLevelStartIdx;
            }

            zoom(step) {
                this.#setZoomByIdx(this.#selectedZoomIdx + step)
            }

            zoomIn() {
                this.zoom(1)
            }

            zoomOut() {
                this.zoom(-1)
            }

            autoZoom() {
                const svgSize =this.#visualization.svgBox
                const viewRect =this.#visualization.viewRect
                const zoomIdx = this.#zoomLevels.findZoomIdx(
                    Math.floor(
                        Math.min(
                            viewRect.width * 10 / svgSize.width,
                            viewRect.height * 10 / svgSize.height,
                        )
                    ) / 10);

                this.#setZoomByIdx(zoomIdx);
            }

            set_zoom(factor) {
                this.#setZoomByIdx(this.#zoomLevels.findZoomIdx(factor))
            }

            #setZoomByIdx(zoomIdx) {
                zoomIdx = Math.max(0, zoomIdx)

                const oldZoom = this.#zoomLevels.get(this.#selectedZoomIdx)
                const zoom = this.#zoomLevels.get(zoomIdx)

                const oldScrollX = this.#visualization.scrollX
                const oldScrollY = this.#visualization.scrollY

                const oldCenterX = (this.#visualization.scrollWidth - this.#visualization.viewRect.width)/2
                const oldCenterY = (this.#visualization.scrollHeight - this.#visualization.viewRect.height)/2

                this.#selectedZoomIdx = zoomIdx
                this.#zoomUpdateSelection()
                this.#visualization.scale_svg(this.#zoomLevels.get(this.#selectedZoomIdx))

                const centerX = (this.#visualization.scrollWidth - this.#visualization.viewRect.width)/2
                const centerY = (this.#visualization.scrollHeight - this.#visualization.viewRect.height)/2

                this.#visualization.scrollX = centerX + (oldCenterX - oldScrollX) * zoom/oldZoom
                this.#visualization.scrollY = centerY + (oldCenterY - oldScrollY) * zoom/oldZoom
            }

            #zoomUpdateSelection() {
                if (Math.max(this.#zoomDropdown.options.length, this.#selectedZoomIdx) > this.#zoomConfig.defaultZoomLevelEndIdx - this.#zoomConfig.defaultZoomLevelStartIdx) {
                    const get_factor_at_option_idx = (option_idx) => {
                        const value = this.#zoomDropdown.options[option_idx].value;
                        return parseFloat(value);
                    }

                    const put_at_front = (zoomIdx) => {
                        let option = create_option(this.#zoomLevels.get(zoomIdx));
                        if (get_factor_at_option_idx(0) != this.#zoomLevels.get(this.#zoomConfig.defaultZoomLevelStartIdx)) {
                            this.#zoomDropdown.options[0].replaceWith(option);
                        } else {
                            // insert in front
                            this.#zoomDropdown.add(option, 0);
                        }
                    }

                    const put_at_back = (zoomIdx) => {
                        let option = create_option(this.#zoomLevels.get(zoomIdx));
                        if (get_factor_at_option_idx(this.#zoomDropdown.options.length - 1) != this.#zoomLevels.get(this.#zoomConfig.defaultZoomLevelEndIdx)) {
                            this.#zoomDropdown.options[this.#zoomDropdown.options.length - 1].replaceWith(option);
                        } else {
                            this.#zoomDropdown.appendChild(option);
                        }
                    }

                    if (this.#selectedZoomIdx < this.#zoomConfig.defaultZoomLevelStartIdx) {
                        put_at_front(this.#selectedZoomIdx);
                    }

                    if (this.#selectedZoomIdx > this.#zoomConfig.defaultZoomLevelEndIdx) {
                        put_at_back(this.#selectedZoomIdx);
                    }

                    if (get_factor_at_option_idx(0) != this.#zoomLevels.get(Math.min(this.#selectedZoomIdx, this.#zoomConfig.defaultZoomLevelStartIdx))) {
                        this.#zoomDropdown.options[0].remove();
                    }

                    if (get_factor_at_option_idx(this.#zoomDropdown.options.length - 1) != this.#zoomLevels.get(Math.max(this.#selectedZoomIdx, this.#zoomConfig.defaultZoomLevelEndIdx))) {
                        this.#zoomDropdown.options[this.#zoomDropdown.options.length - 1].remove();
                    }
                }

                this.#zoomDropdown.selectedIndex = this.#selectedZoomIdx < this.#zoomConfig.defaultZoomLevelStartIdx ? 0
                    : this.#selectedZoomIdx > this.#zoomConfig.defaultZoomLevelEndIdx ? this.#zoomDropdown.options.length - 1
                        : this.#selectedZoomIdx - this.#zoomConfig.defaultZoomLevelStartIdx;
            }
        }

        class ZoomConfig {
            constructor({ defaultZoomLevelStartIdx, defaultZoomLevelEndIdx, defaultZoomIdx, steps }) {
                this.defaultZoomLevelStartIdx = defaultZoomLevelStartIdx
                this.defaultZoomLevelEndIdx = defaultZoomLevelEndIdx
                this.defaultZoomIdx = defaultZoomIdx
                this.steps = steps
            }
        }

        class ZoomLevels {
            #config
            #levels = []
            #levelsGen

            constructor(config) {
                this.#config = config
                this.#levelsGen = (function*() {
                    let step_idx = 0

                    let factor = this.#config.steps[0][1]
                    do {
                        yield factor
                        let step = this.#config.steps[step_idx][1]
                        factor = Math.round((factor + step) * 100) / 100

                        if (step_idx + 1 < this.#config.steps.length
                            && factor >= this.#config.steps[step_idx + 1][0]) {
                            step_idx++
                        }
                    } while (true)
                }).call(this)

                this.#initiateZoomLevels()
            }

            closest_smaller_factor(factor) {
                return this.get(this.findZoomIdx(factor))
            }

            // Return the index of the closes factor that is smaller or equal to the provided factor parameter.
            findZoomIdx(factor) {
                let i = 0;
                while (factor >= this.#levels[i + 1]) {
                    i++;
                    if (i + 1 == this.#levels.length)
                        this.#addZoomLevel();
                }

                return i;
            }

            get(idx) {
                while (this.#levels.length <= idx) {
                    this.#addZoomLevel();
                }

                return this.#levels[idx]
            }

            #initiateZoomLevels() {
                do {
                    this.#addZoomLevel();
                } while (this.#levels.length <= Math.max(this.#config.defaultZoomLevelEndIdx, this.#config.defaultZoomIdx));
            }

            #addZoomLevel() {
                const { value: factor } = this.#levelsGen.next();
                this.#levels.push(factor);
            }
        }


        function create_option(factor) {
            function format_factor(x) {
                return Math.floor(x * 100).toString() + "%";
            }

            return new Option(format_factor(factor), factor);
        }

        const zoomHandler = new PanelZoomHandler()

        const zoomDropdown = document.getElementById("zoom_dropdown");

        zoomDropdown.addEventListener("change", (event) => {
            const factor = parseFloat(event.target.value);
            zoomHandler.set_zoom(factor);
        });

        zoomDropdown.addEventListener('wheel', (event) => {
            event.preventDefault();
            event.stopPropagation();

            if (event.deltaY < 0) zoomHandler.zoomIn();
            else zoomHandler.zoomOut();
        });

        window.addEventListener('wheel', (event) => {
            if (event.ctrlKey) {
                event.preventDefault();
                if (event.deltaY < 0) zoomHandler.zoomIn();
                else zoomHandler.zoomOut();
            } else if (event.shiftKey) {
                event.preventDefault();
                window.scrollBy(event.deltaY, 0);
            }
        });

        window.addEventListener('keydown', (e) => {
            if (!e.ctrlKey && !e.metaKey) {
                if (e.key === '+') {
                    zoomHandler.zoom(2);
                } else if (e.key === '-') {
                    zoomHandler.zoom(-2);
                } else if (e.key === '0') {
                    zoomHandler.autoZoom();
                }
            }
        });
        </script>
    </body>
</html>
