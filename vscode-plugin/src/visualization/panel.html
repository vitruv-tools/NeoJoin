<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'unsafe-inline';"
        />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>NeoJoin Preview</title>
        <style>
            html,
            body {
                width: 100%;
                height: 100%;
                padding: 0;
                margin: 0;
                display: flex;
                flex-direction: column;
                align-items: stretch;
            }

            #status {
                padding: 0.5em;

                display: flex;
                align-items: center;

                form {
                    display: inline-flex;
                    align-items: center;

                    label {
                        display: inline-flex;
                        align-items: center;
                        margin-left: 0.5em;

                        cursor: help;
                        text-decoration: dotted underline;
                        text-underline-offset: 2px;
                    }
                }

                background: color-mix(
                    in srgb,
                    var(--vscode-badge-background),
                    transparent 50%
                );

                &.warning {
                    background: rgba(255, 204, 0, 0.4);
                }

                &.error {
                    background: rgba(255, 0, 0, 0.3);
                }

                #message {
                    flex: 1;
                    margin: 0 1.5em;
                    text-align: center;

                    color: var(--vscode-editor-foreground);
                }
            }

            #visualization_outer {
                flex:1 1 auto;
                min-height:0;
                min-width:0;
                overflow:hidden;
                display:flex;
                justify-content:center;
                align-items:center;
            }

            #visualization {
                width: 100%;
                height: 100%;
                flex: 1 1 auto;
                overflow: auto;
                min-height: 0;
                min-width: 0;
                display: flex;
                justify-content: safe center;
                align-items: safe center;

                > svg {
                    flex: none;
                }

                > svg,
                > svg > g > rect {
                    background: transparent !important;
                    fill: none !important;
                }
            }

            /* Fix font color of <<enumeration>> in dark mode */
            .vscode-dark #visualization > svg text[font-style="italic"] {
                fill: white;
            }
        </style>
    </head>
    <body>
        <div id="status">
            <form id="options">
                Mode:
                <label
                    title="Show all classes of the target model as well as all classes of the source models"
                >
                    <input type="radio" name="mode" value="full" />
                    <span>Full</span>
                </label>

                <label
                    title="Show all classes of the target model as well as all referenced classes of the source models"
                >
                    <input type="radio" name="mode" value="referenced" />
                    <span>Referenced</span>
                </label>

                <label
                    title="Show the target class produced by the queries overlapping with the cursor text selection as well as all referenced classes of the source models"
                >
                    <input type="radio" name="mode" value="selected" />
                    <span>Selected</span>
                </label>

                <label title="Draw orthogonal arrows">
                    <input type="checkbox" name="orthogonal" />
                    <span>Orthogonal</span>
                </label>
            </form>
            <span id="message">Loading ...</span>
            <span>
                Zoom:
                <select id="zoom">
                    <option value="1.5">150%</option>
                    <option value="1.25">125%</option>
                    <option value="1" selected>100%</option>
                    <option value="0.9">90%</option>
                    <option value="0.8">80%</option>
                    <option value="0.7">70%</option>
                    <option value="0.6">60%</option>
                    <option value="0.5">50%</option>
                    <option value="0.4">40%</option>
                </select>
                <button id="auto_zoom_btn" type="button">auto</button>
            </span>
        </div>
        <div id="visualization_outer">
            <div id="visualization"></div>
        </div>
        <script>
            const vscode = acquireVsCodeApi();
            const state = {
                uri: "%URI%",
                options: {
                    mode: "%MODE%",
                    orthogonal: %ORTHOGONAL%,
                },
            };
            vscode.setState(state);

            // persist option changes + notify extension
            const options = document.getElementById("options");
            options.addEventListener("change", (event) => {
                const option = event.target.name;
                const newValue =
                    event.target.type === "checkbox"
                        ? event.target.checked
                        : event.target.value;
                state.options[option] = newValue;
                vscode.setState(state);

                vscode.postMessage({
                    command: "option",
                    option: option,
                    value: newValue,
                });
            });

            // handle updates from extension
            const status = document.getElementById("status");
            const message = document.getElementById("message");
            const visualization = document.getElementById("visualization");
            const statusClassFor = {
                ok: "",
                warning: "warning",
                error: "error",
            }
            function update(data) {
                status.className = statusClassFor[data.type];
                message.innerText = data.message;

                if (data.svg) {
                    visualization.innerHTML = data.svg;
                    auto_zoom();
                }
            }
            window.addEventListener("message", (event) => update(event.data));

            // restore previous settings
            function restore(selector, apply) {
                const input = document.querySelector(selector);
                if (input) {
                    apply(input);
                }
            }
            restore(
                `#options input[name="mode"][value="${state.options.mode}"]`,
                (input) => input.checked = true
            );
            restore(
                `#options input[name="orthogonal"]`,
                (input) => input.checked = state.options.orthogonal
            );

            // handle zoom

            const zoom_config = {
                default_step_start: 0.4,
                default_number_of_steps: 11,
                default_selected: 1.0,
                // pairs of lower boundary (exclusively) to zoom step
                steps: [
                [0.0, 0.05],
                [0.4, 0.1],
                [1.0, 0.25],
                [2.0, 0.5],
                [3.0, 1.0],
                ],
            };

            function zoom_redraw() {
                function format_factor(x) {
                return Math.floor(x * 100).toString() + "%";
                }

                const oldSelect = document.getElementById('zoom');
                const newSelect = document.createElement('select');
                newSelect.id = 'zoom';

                var last_factor=zoom_config.default_step_start;
                var last_step_idx=0; // TODO: set properly
                while (last_step_idx + 1 < zoom_config.steps.length
                    && last_factor >= zoom_config.steps[last_step_idx + 1][0]) {
                    last_step_idx++;
                }

                newSelect.appendChild(
                new Option(format_factor(last_factor), last_factor)
                );

                for (var i = 1; i < zoom_config.default_number_of_steps; i++) {
                if (last_step_idx + 1 < zoom_config.steps.length
                    && last_factor >= zoom_config.steps[last_step_idx + 1][0]) {
                    last_step_idx++;
                }

                factor = Math.round((last_factor + zoom_config.steps[last_step_idx][1]) * 100)/100;
                last_factor = factor;


                newSelect.appendChild(
                    new Option(format_factor(factor), factor)
                );
                }

                for (const option of newSelect.options) {
                    console.log(option.value, option.text);
                    if (option.value == zoom_config.default_selected) {
                        console.log("set selected", option.value, option.text);
                        option.selected = true;
                        break;
                    }
                }

                oldSelect.parentNode.replaceChild(newSelect, oldSelect);
            }

            zoom_redraw();

            function set_zoom(factor) {
                const svg = visualization.querySelector("svg");
                if (!svg) {
                    requestAnimationFrame(() => set_zoom(factor));
                    return;
                }

                // use width/height instead of `transform: scale(...)` to avoid issues with scrollbars
                const svgSize = svg.getBBox();
                svg.style.width = `${svgSize.width * factor}px`;
                svg.style.height = `${svgSize.height * factor}px`;
            }

            const zoom = document.getElementById("zoom");
            zoom.addEventListener("change", (event) => {
                const factor = event.target.value;
                console.log("zoom changed")
                set_zoom(factor);
            });

            function zoom_factor_enforce_bounds(factor) {
                return factor >= 1.5? 1.5
                    : factor >= 1.25? 1.25
                    : factor >= 1 ? 1
                    : factor <= 0.4 ?  0.4
                    : factor;
            }

            function auto_zoom() {
                const svg = visualization.querySelector("svg");
                const svgSize = svg.getBBox();
                const outer = document.getElementById("visualization_outer");
                const view_rect = outer.getBoundingClientRect();
                let factor = zoom_factor_enforce_bounds(
                    Math.floor(
                        Math.min(
                            view_rect.width * 10 / svgSize.width,
                            view_rect.height * 10 / svgSize.height,
                        )
                    ) / 10);
                zoom.value = factor;
                set_zoom(factor);

                console.log("auto zoom: " + factor);
                console.log("row zoom: " + (document.documentElement.clientWidth / svgSize.width));
            }
            const auto_zoom_btn = document.getElementById("auto_zoom_btn")
            auto_zoom_btn.addEventListener("click", (_) => auto_zoom())

            function update_zoom() {
                const factor = zoom.options[zoom.selectedIndex].value;
                set_zoom(factor)
            }

            function zoom_in() {
                console.log('zoom in');
                if (zoom.selectedIndex + 1 < zoom.options.length) {
                    zoom.selectedIndex++;
                    update_zoom();
                }
            }

            function zoom_out() {
                console.log('zoom out');
                if (zoom.selectedIndex > 0) {
                    zoom.selectedIndex--;
                    update_zoom();
                }
            }

            zoom.addEventListener('wheel', (e) => {
                if (e.deltaY < 0) zoom_in()
                else zoom_out()
            });

            window.addEventListener('wheel', (e) => {
                if (e.ctrlKey) {
                    e.preventDefault();
                    if (e.deltaY < 0) zoom_in();
                    else zoom_out();
                } else if (e.shiftKey) {
                    e.preventDefault();
                    window.scrollBy(e.deltaY, 0);
                }
            });
        </script>
    </body>
</html>
