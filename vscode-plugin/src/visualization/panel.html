<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'unsafe-inline';"
        />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>NeoJoin Preview</title>
        <style>
            html,
            body {
                width: 100%;
                height: 100%;
                padding: 0;
                margin: 0;
                display: flex;
                flex-direction: column;
                align-items: stretch;
            }

            #status {
                padding: 0.5em;

                display: flex;
                align-items: center;

                form {
                    display: inline-flex;
                    align-items: center;

                    label {
                        display: inline-flex;
                        align-items: center;
                        margin-left: 0.5em;

                        cursor: help;
                        text-decoration: dotted underline;
                        text-underline-offset: 2px;
                    }
                }

                background: color-mix(
                    in srgb,
                    var(--vscode-badge-background),
                    transparent 50%
                );

                &.warning {
                    background: rgba(255, 204, 0, 0.4);
                }

                &.error {
                    background: rgba(255, 0, 0, 0.3);
                }

                #message {
                    flex: 1;
                    margin: 0 1.5em;
                    text-align: center;

                    color: var(--vscode-editor-foreground);
                }
            }

            #visualization_outer {
                flex:1 1 auto;
                min-height:0;
                min-width:0;
                overflow:hidden;
                display:flex;
                justify-content:center;
                align-items:center;
            }

            #visualization {
                width: 100%;
                height: 100%;
                flex: 1 1 auto;
                overflow: auto;
                min-height: 0;
                min-width: 0;
                display: flex;
                justify-content: safe center;
                align-items: safe center;

                > svg {
                    flex: none;
                }

                > svg,
                > svg > g > rect {
                    background: transparent !important;
                    fill: none !important;
                }
            }

            /* Fix font color of <<enumeration>> in dark mode */
            .vscode-dark #visualization > svg text[font-style="italic"] {
                fill: white;
            }

            .zoom-ui {
                height: 1.4em;
                /* vertical-align: middle; */
            }

            .zoom-btn {
                background-color: transparent;
                border: none;
                padding: 0;
                color: white;
                font-size: 1.6em;
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <div id="status">
            <form id="options">
                Mode:
                <label
                    title="Show all classes of the target model as well as all classes of the source models"
                >
                    <input type="radio" name="mode" value="full" />
                    <span>Full</span>
                </label>

                <label
                    title="Show all classes of the target model as well as all referenced classes of the source models"
                >
                    <input type="radio" name="mode" value="referenced" />
                    <span>Referenced</span>
                </label>

                <label
                    title="Show the target class produced by the queries overlapping with the cursor text selection as well as all referenced classes of the source models"
                >
                    <input type="radio" name="mode" value="selected" />
                    <span>Selected</span>
                </label>

                <label title="Draw orthogonal arrows">
                    <input type="checkbox" name="orthogonal" />
                    <span>Orthogonal</span>
                </label>
            </form>
            <span id="message">Loading ...</span>
            <span>
                Zoom:
                <button onclick="zoom_out()" class="zoom-ui zoom-btn">-</button>
                <button onclick="zoom_in()" class="zoom-ui zoom-btn">+</button>
                <select id="zoom" class="zoom-ui">
                </select>
                <button id="auto_zoom_btn" class="zoom-ui" type="button">auto</button>
            </span>
        </div>
        <div id="visualization_outer">
            <div id="visualization"></div>
        </div>
        <script>
            const vscode = acquireVsCodeApi();
            const state = {
                uri: "%URI%",
                options: {
                    mode: "%MODE%",
                    orthogonal: %ORTHOGONAL%,
                },
            };
            vscode.setState(state);

            // persist option changes + notify extension
            const options = document.getElementById("options");
            options.addEventListener("change", (event) => {
                const option = event.target.name;
                const newValue =
                    event.target.type === "checkbox"
                        ? event.target.checked
                        : event.target.value;
                state.options[option] = newValue;
                vscode.setState(state);

                vscode.postMessage({
                    command: "option",
                    option: option,
                    value: newValue,
                });
            });

            // handle updates from extension
            const status = document.getElementById("status");
            const message = document.getElementById("message");
            const visualization = document.getElementById("visualization");
            const statusClassFor = {
                ok: "",
                warning: "warning",
                error: "error",
            }
            function update(data) {
                status.className = statusClassFor[data.type];
                message.innerText = data.message;

                if (data.svg) {
                    visualization.innerHTML = data.svg;
                    auto_zoom();
                }
            }
            window.addEventListener("message", (event) => update(event.data));

            // restore previous settings
            function restore(selector, apply) {
                const input = document.querySelector(selector);
                if (input) {
                    apply(input);
                }
            }
            restore(
                `#options input[name="mode"][value="${state.options.mode}"]`,
                (input) => input.checked = true
            );
            restore(
                `#options input[name="orthogonal"]`,
                (input) => input.checked = state.options.orthogonal
            );

            // handle zoom
            const zoom = document.getElementById("zoom");
            const zoom_config = {
                // default_zoom_level_start_idx/default_zoom_level_end_idx describe which zoom levels are displayed inside the zoom picker by default.
                default_zoom_level_start_idx: 19,
                default_zoom_level_end_idx: 19 + 15,

                // under the current configuration zoom_idx == 19 + 12 is equivalent to zoom factor 1.0
                default_zoom_idx: 19 + 12,

                // pairs of lower boundary (exclusively) to zoom step
                steps: [
                    [0.0, 0.02],
                    [0.4, 0.05],
                    [1.2, 0.1],
                    [1.75, 0.25],
                    [3.0, 0.5],
                    [4.0, 1.0],
                    [5.0, 1.5],
                ],
            };

            function* generate_zoom_levels() {
                let step_idx = 0;

                let factor = zoom_config.steps[0][1];
                do {
                    yield factor;
                    let step = zoom_config.steps[step_idx][1];
                    factor = Math.round((factor + step) * 100)/100;

                    if (step_idx + 1 < zoom_config.steps.length
                        && factor >= zoom_config.steps[step_idx + 1][0]) {
                        step_idx++;
                    }
                } while (true);
            }

            let zoom_levels_gen = generate_zoom_levels();
            let zoom_levels = [];
            function add_zoom_level() {
                const { value: factor } = zoom_levels_gen.next();
                zoom_levels.push(factor);
            }

            do {
                add_zoom_level();
            } while (zoom_levels.length <= Math.max(zoom_config.default_zoom_level_end_idx, zoom_config.default_zoom_idx));


            function create_option(factor) {
                function format_factor(x) {
                    return Math.floor(x * 100).toString() + "%";
                }

                return new Option(format_factor(factor), factor);
            }

            // index into zoom_levels describing the currently selected value.
            let selected_zoom_idx = zoom_config.default_zoom_idx;

            // initiate zoom selection menu
            for (let i = zoom_config.default_zoom_level_start_idx; i <= zoom_config.default_zoom_level_end_idx; i++) {
                zoom.appendChild(create_option(zoom_levels[i]));
            }
            zoom.selectedIndex = selected_zoom_idx - zoom_config.default_zoom_level_start_idx;

            function zoom_update_selection() {
                if (Math.max(zoom.options.length, selected_zoom_idx) > zoom_config.default_zoom_level_end_idx - zoom_config.default_zoom_level_start_idx)  {
                    function get_factor_at_option_idx(option_idx) {
                        const value = zoom.options[option_idx].value;
                        return parseFloat(value);
                    }

                    function put_at_front(zoom_idx) {
                        let option = create_option(zoom_levels[zoom_idx]);
                        if (get_factor_at_option_idx(0) != zoom_levels[zoom_config.default_zoom_level_start_idx]) {
                            zoom.options[0].replaceWith(option);
                        } else {
                            // insert in front
                            zoom.add(option, 0);
                        }
                    }

                    function put_at_back(zoom_idx) {
                        let option = create_option(zoom_levels[zoom_idx]);
                        if (get_factor_at_option_idx(zoom.options.length - 1) != zoom_levels[zoom_config.default_zoom_level_end_idx]) {
                            zoom.options[zoom.options.length - 1].replaceWith(option);
                        } else {
                            zoom.appendChild(option);
                        }
                    }

                    if (selected_zoom_idx < zoom_config.default_zoom_level_start_idx) {
                        put_at_front(selected_zoom_idx);
                    }

                    if (selected_zoom_idx > zoom_config.default_zoom_level_end_idx) {
                        put_at_back(selected_zoom_idx);
                    }

                    if (get_factor_at_option_idx(0) != zoom_levels[Math.min(selected_zoom_idx, zoom_config.default_zoom_level_start_idx)]) {
                        zoom.options[0].remove();
                    }

                    if (get_factor_at_option_idx(zoom.options.length - 1) != zoom_levels[Math.max(selected_zoom_idx, zoom_config.default_zoom_level_end_idx)]) {
                        zoom.options[zoom.options.length - 1].remove();
                    }
                }

                zoom.selectedIndex = selected_zoom_idx < zoom_config.default_zoom_level_start_idx? 0
                    : selected_zoom_idx > zoom_config.default_zoom_level_end_idx? zoom.options.length - 1
                    : selected_zoom_idx - zoom_config.default_zoom_level_start_idx;
            }

            function set_zoom(zoom_idx) {
                if (zoom_idx < 0) return;

                while (zoom_idx >= zoom_levels.length) {
                    add_zoom_level();
                }
                selected_zoom_idx = zoom_idx;
                zoom_update_selection();
                scale_diagram(zoom_levels[selected_zoom_idx]);
            }

            function scale_diagram(factor) {
                const svg = visualization.querySelector("svg");
                if (!svg) {
                    requestAnimationFrame(() => scale_diagram(factor));
                    return;
                }

                // use width/height instead of `transform: scale(...)` to avoid issues with scrollbars
                const svgSize = svg.getBBox();
                svg.style.width = `${svgSize.width * factor}px`;
                svg.style.height = `${svgSize.height * factor}px`;
            }

            zoom.addEventListener("change", (event) => {
                const factor = parseFloat(event.target.value);
                scale_diagram(factor);
            });

            function auto_zoom() {
                function find_zoom_idx(factor) {
                    let i = 0;
                    while (factor > zoom_levels[i + 1]) {
                        i++;
                        if (i + 1 == zoom_levels.length)
                            add_zoom_level();
                    }

                    return i;
                }

                const svg = visualization.querySelector("svg");
                const svgSize = svg.getBBox();
                const outer = document.getElementById("visualization_outer");
                const view_rect = outer.getBoundingClientRect();
                let zoom_idx = find_zoom_idx(
                    Math.floor(
                        Math.min(
                            view_rect.width * 10 / svgSize.width,
                            view_rect.height * 10 / svgSize.height,
                        )
                    ) / 10);

                set_zoom(zoom_idx);
            }
            const auto_zoom_btn = document.getElementById("auto_zoom_btn");
            auto_zoom_btn.addEventListener("click", (_) => auto_zoom());

            function zoom_in() {
                set_zoom(selected_zoom_idx+1);
            }

            function zoom_out() {
                set_zoom(selected_zoom_idx-1)
            }

            zoom.addEventListener('wheel', (e) => {
                if (e.deltaY < 0) zoom_in();
                else zoom_out();
            });

            window.addEventListener('wheel', (e) => {
                if (e.ctrlKey) {
                    e.preventDefault();
                    if (e.deltaY < 0) zoom_in();
                    else zoom_out();
                } else if (e.shiftKey) {
                    e.preventDefault();
                    window.scrollBy(e.deltaY, 0);
                }
            });

            window.addEventListener('keydown', (e) => {
                if (!e.ctrlKey && !e.metaKey) {
                    if (e.key === '+') {
                        zoom_in();
                    } else if (e.key === '-') {
                        zoom_out();
                    } else if (e.key === '0') {
                        auto_zoom();
                    }
                }
            });

        </script>
    </body>
</html>
