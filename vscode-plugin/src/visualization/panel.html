<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'unsafe-inline';"
        />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>NeoJoin Preview</title>
        <style>
            html,
            body {
                width: 100%;
                height: 100%;
                padding: 0;
                margin: 0;
                display: flex;
                flex-direction: column;
                align-items: stretch;
            }

            #status {
                padding: 0.5em;

                display: flex;
                align-items: center;

                form {
                    display: inline-flex;
                    align-items: center;

                    label {
                        display: inline-flex;
                        align-items: center;
                        margin-left: 0.5em;

                        cursor: help;
                        text-decoration: dotted underline;
                        text-underline-offset: 2px;
                    }
                }

                background: color-mix(
                    in srgb,
                    var(--vscode-badge-background),
                    transparent 50%
                );

                &.warning {
                    background: rgba(255, 204, 0, 0.4);
                }

                &.error {
                    background: rgba(255, 0, 0, 0.3);
                }

                #message {
                    flex: 1;
                    margin: 0 1.5em;
                    text-align: center;

                    color: var(--vscode-editor-foreground);
                }
            }

            #visualization_outer {
                flex:1 1 auto;
                min-height:0;
                min-width:0;
                overflow:hidden;
                display:flex;
                justify-content:center;
                align-items:center;
            }

            #visualization {
                width: 100%;
                height: 100%;
                flex: 1 1 auto;
                overflow: auto;
                min-height: 0;
                min-width: 0;
                display: flex;
                justify-content: safe center;
                align-items: safe center;

                > svg {
                    flex: none;
                }

                > svg,
                > svg > g > rect {
                    background: transparent !important;
                    fill: none !important;
                }
            }

            /* Fix font color of <<enumeration>> in dark mode */
            .vscode-dark #visualization > svg text[font-style="italic"] {
                fill: white;
            }

            .zoom-ui {
                height: 1.4em;
                /* vertical-align: middle; */
            }

            .zoom-btn {
                background-color: transparent;
                border: none;
                padding: 0;
                color: white;
                font-size: 1.6em;
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <div id="status">
            <form id="options">
                Mode:
                <label
                    title="Show all classes of the target model as well as all classes of the source models"
                >
                    <input type="radio" name="mode" value="full" />
                    <span>Full</span>
                </label>

                <label
                    title="Show all classes of the target model as well as all referenced classes of the source models"
                >
                    <input type="radio" name="mode" value="referenced" />
                    <span>Referenced</span>
                </label>

                <label
                    title="Show the target class produced by the queries overlapping with the cursor text selection as well as all referenced classes of the source models"
                >
                    <input type="radio" name="mode" value="selected" />
                    <span>Selected</span>
                </label>

                <label title="Draw orthogonal arrows">
                    <input type="checkbox" name="orthogonal" />
                    <span>Orthogonal</span>
                </label>
            </form>
            <span id="message">Loading ...</span>
            <span>
                Zoom:
                <button onclick="zoom_handler.zoom_out()" class="zoom-ui zoom-btn">-</button>
                <button onclick="zoom_handler.zoom_in()" class="zoom-ui zoom-btn">+</button>
                <select id="zoom_dropdown" class="zoom-ui">
                </select>
                <button onclick="zoom_handler.auto_zoom()" class="zoom-ui" type="button">auto</button>
            </span>
        </div>
        <div id="visualization_outer">
            <div id="visualization"></div>
        </div>
        <script>
            const vscode = acquireVsCodeApi();
            const state = {
                uri: "%URI%",
                options: {
                    mode: "%MODE%",
                    orthogonal: %ORTHOGONAL%,
                },
            };
            vscode.setState(state);

            // persist option changes + notify extension
            const options = document.getElementById("options");
            options.addEventListener("change", (event) => {
                const option = event.target.name;
                const newValue =
                    event.target.type === "checkbox"
                        ? event.target.checked
                        : event.target.value;
                state.options[option] = newValue;
                vscode.setState(state);

                vscode.postMessage({
                    command: "option",
                    option: option,
                    value: newValue,
                });
            });

            // handle updates from extension
            const status = document.getElementById("status");
            const message = document.getElementById("message");
            const visualization = document.getElementById("visualization");
            const statusClassFor = {
                ok: "",
                warning: "warning",
                error: "error",
            }
            function update(data) {
                status.className = statusClassFor[data.type];
                message.innerText = data.message;

                if (data.svg) {
                    visualization.innerHTML = data.svg;
                    zoom_handler.auto_zoom();
                }
            }
            window.addEventListener("message", (event) => update(event.data));

            // restore previous settings
            function restore(selector, apply) {
                const input = document.querySelector(selector);
                if (input) {
                    apply(input);
                }
            }
            restore(
                `#options input[name="mode"][value="${state.options.mode}"]`,
                (input) => input.checked = true
            );
            restore(
                `#options input[name="orthogonal"]`,
                (input) => input.checked = state.options.orthogonal
            );

            class PanelZoomHandler {
                #zoom_dropdown = document.getElementById('zoom_dropdown')
                #visualization = document.getElementById("visualization");

                #zoom_config

                // The index into zoom_levels describing the currently selected value.
                #selected_zoom_idx
                #zoom_levels

                constructor() {
                    this.#zoom_config = new ZoomConfig({
                        // default_zoom_level_start_idx/default_zoom_level_end_idx describe which zoom levels are displayed inside the zoom picker by default.
                        default_zoom_level_start_idx: 21,
                        default_zoom_level_end_idx: 21 + 15,

                        // under the current configuration zoom_idx == 21 + 10 is equivalent to zoom factor 1.0
                        default_zoom_idx: 21 + 10,

                        // pairs of inclusive lower boundary to zoom step
                        steps: [
                            [0.0, 0.02],
                            [0.4, 0.05],
                            [1.2, 0.1],
                            [1.75, 0.25],
                            [3.0, 0.5],
                            [4.0, 1.0],
                            [5.0, 1.5],
                        ],
                    });

                    this.#zoom_levels = new ZoomLevels(this.#zoom_config)

                    this.#selected_zoom_idx = this.#zoom_config.default_zoom_idx;

                    this.#initiate_zoom_dropdown()
                }

                #initiate_zoom_dropdown() {
                    for (let i = this.#zoom_config.default_zoom_level_start_idx; i <= this.#zoom_config.default_zoom_level_end_idx; i++) {
                        this.#zoom_dropdown.appendChild(create_option(this.#zoom_levels.get(i)));
                    }
                    this.#zoom_dropdown.selectedIndex = this.#selected_zoom_idx - this.#zoom_config.default_zoom_level_start_idx;
                }

                zoom_in() {
                    this.#set_zoom_by_idx(this.#selected_zoom_idx + 1)
                }

                zoom_out() {
                    this.#set_zoom_by_idx(this.#selected_zoom_idx - 1)
                }

                auto_zoom() {
                    const svg = this.#visualization.querySelector("svg");
                    const svgSize = svg.getBBox();
                    const outer = document.getElementById("visualization_outer");
                    const view_rect = outer.getBoundingClientRect();
                    const zoom_idx = this.#zoom_levels.find_zoom_idx(
                        Math.floor(
                            Math.min(
                                view_rect.width * 10 / svgSize.width,
                                view_rect.height * 10 / svgSize.height,
                            )
                        ) / 10);

                    this.#set_zoom_by_idx(zoom_idx);
                }

                set_zoom(factor) {
                    this.#set_zoom_by_idx(this.#zoom_levels.find_zoom_idx(factor))
                }

                #set_zoom_by_idx(zoom_idx) {
                    if (zoom_idx < 0) return

                    this.#selected_zoom_idx = zoom_idx;
                    this.#zoom_update_selection();
                    this.#scale_diagram(this.#zoom_levels.get(this.#selected_zoom_idx));
                }

                #scale_diagram(factor) {
                    const svg = this.#visualization.querySelector("svg");
                    if (!svg) {
                        requestAnimationFrame(() => this.#scale_diagram(factor));
                        return;
                    }

                    // use width/height instead of `transform: scale(...)` to avoid issues with scrollbars
                    const svgSize = svg.getBBox();
                    svg.style.width = `${svgSize.width * factor}px`;
                    svg.style.height = `${svgSize.height * factor}px`;
                }

                #zoom_update_selection() {
                    if (Math.max(this.#zoom_dropdown.options.length, this.#selected_zoom_idx) > this.#zoom_config.default_zoom_level_end_idx - this.#zoom_config.default_zoom_level_start_idx) {
                        const get_factor_at_option_idx = (option_idx) => {
                            const value = this.#zoom_dropdown.options[option_idx].value;
                            return parseFloat(value);
                        }

                        const put_at_front = (zoom_idx) => {
                            let option = create_option(this.#zoom_levels.get(zoom_idx));
                            if (get_factor_at_option_idx(0) != this.#zoom_levels.get(this.#zoom_config.default_zoom_level_start_idx)) {
                                this.#zoom_dropdown.options[0].replaceWith(option);
                            } else {
                                // insert in front
                                this.#zoom_dropdown.add(option, 0);
                            }
                        }

                        const put_at_back = (zoom_idx) => {
                            let option = create_option(this.#zoom_levels.get(zoom_idx));
                            if (get_factor_at_option_idx(this.#zoom_dropdown.options.length - 1) != this.#zoom_levels.get(this.#zoom_config.default_zoom_level_end_idx)) {
                                this.#zoom_dropdown.options[this.#zoom_dropdown.options.length - 1].replaceWith(option);
                            } else {
                                this.#zoom_dropdown.appendChild(option);
                            }
                        }

                        if (this.#selected_zoom_idx < this.#zoom_config.default_zoom_level_start_idx) {
                            put_at_front(this.#selected_zoom_idx);
                        }

                        if (this.#selected_zoom_idx > this.#zoom_config.default_zoom_level_end_idx) {
                            put_at_back(this.#selected_zoom_idx);
                        }

                        if (get_factor_at_option_idx(0) != this.#zoom_levels.get(Math.min(this.#selected_zoom_idx, this.#zoom_config.default_zoom_level_start_idx))) {
                            this.#zoom_dropdown.options[0].remove();
                        }

                        if (get_factor_at_option_idx(this.#zoom_dropdown.options.length - 1) != this.#zoom_levels.get(Math.max(this.#selected_zoom_idx, this.#zoom_config.default_zoom_level_end_idx))) {
                            this.#zoom_dropdown.options[this.#zoom_dropdown.options.length - 1].remove();
                        }
                    }

                    this.#zoom_dropdown.selectedIndex = this.#selected_zoom_idx < this.#zoom_config.default_zoom_level_start_idx ? 0
                        : this.#selected_zoom_idx > this.#zoom_config.default_zoom_level_end_idx ? this.#zoom_dropdown.options.length - 1
                        : this.#selected_zoom_idx - this.#zoom_config.default_zoom_level_start_idx;
                }
            }

            class ZoomConfig {
                constructor({default_zoom_level_start_idx, default_zoom_level_end_idx, default_zoom_idx, steps}) {
                    this.default_zoom_level_start_idx = default_zoom_level_start_idx
                    this.default_zoom_level_end_idx = default_zoom_level_end_idx
                    this.default_zoom_idx = default_zoom_idx
                    this.steps = steps
                }
            }

            class ZoomLevels {
                #zoom_config
                #zoom_levels = []
                #zoom_levels_gen

                constructor(zoom_config) {
                    this.#zoom_config = zoom_config
                    this.#zoom_levels_gen = (function*() {
                        let step_idx = 0

                        let factor = this.#zoom_config.steps[0][1]
                        do {
                            yield factor
                            let step = this.#zoom_config.steps[step_idx][1]
                            factor = Math.round((factor + step) * 100) / 100

                            if (step_idx + 1 < this.#zoom_config.steps.length
                                && factor >= this.#zoom_config.steps[step_idx + 1][0]) {
                                step_idx++
                            }
                        } while (true)
                    }).call(this)

                    this.#initiate_zoom_levels()
                }

                closest_smaller_factor(factor) {
                    return this.get(this.find_zoom_idx(factor))
                }

                // Return the index of the closes factor that is smaller or equal to the provided factor parameter.
                find_zoom_idx(factor) {
                    let i = 0;
                    while (factor >= this.#zoom_levels[i + 1]) {
                        i++;
                        if (i + 1 == this.#zoom_levels.length)
                            this.#add_zoom_level();
                    }

                    return i;
                }

                get(idx) {
                    while (this.#zoom_levels.length <= idx) {
                        this.#add_zoom_level();
                    }

                    return this.#zoom_levels[idx]
                }

                #initiate_zoom_levels() {
                    do {
                        this.#add_zoom_level();
                    } while (this.#zoom_levels.length <= Math.max(this.#zoom_config.default_zoom_level_end_idx, this.#zoom_config.default_zoom_idx));
                }

                #add_zoom_level() {
                    const { value: factor } = this.#zoom_levels_gen.next();
                    this.#zoom_levels.push(factor);
                }
            }


            function create_option(factor) {
                function format_factor(x) {
                    return Math.floor(x * 100).toString() + "%";
                }

                return new Option(format_factor(factor), factor);
            }

            const zoom_handler = new PanelZoomHandler()

            const zoom_dropdown = document.getElementById("zoom_dropdown");

            zoom_dropdown.addEventListener("change", (event) => {
                const factor = parseFloat(event.target.value);
                zoom_handler.set_zoom(factor);
            });

            zoom_dropdown.addEventListener('wheel', (event) => {
                event.preventDefault();
                event.stopPropagation();

                if (event.deltaY < 0) zoom_handler.zoom_in();
                else zoom_handler.zoom_out();
            });

            window.addEventListener('wheel', (event) => {
                if (event.ctrlKey) {
                    event.preventDefault();
                    if (event.deltaY < 0) zoom_handler.zoom_in();
                    else zoom_handler.zoom_out();
                } else if (event.shiftKey) {
                    event.preventDefault();
                    window.scrollBy(event.deltaY, 0);
                }
            });

            window.addEventListener('keydown', (e) => {
                if (!e.ctrlKey && !e.metaKey) {
                    if (e.key === '+') {
                        zoom_handler.zoom_in();
                    } else if (e.key === '-') {
                        zoom_handler.zoom_out();
                    } else if (e.key === '0') {
                        zoom_handler.auto_zoom();
                    }
                }
            });

        </script>
    </body>
</html>
