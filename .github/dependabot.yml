version: 2
updates:
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: daily
  commit-message:
    prefix: "GitHub Actions"
    include: "scope"
- package-ecosystem: "maven"
  directory: "/lang/"
  schedule:
    interval: daily
  commit-message:
    prefix: "Maven"
    include: "scope"
  ignore:
  - dependency-name: "org.eclipse.xtext:*" # new updates requires Java 21
  groups:
    ecore:
      patterns:
      - "org.eclipse.emf:org.eclipse.emf.ecore*"
    xtext:
      patterns:
      - "org.eclipse.xtext:*"
    lsp4j:
      patterns:
      - "org.eclipse.lsp4j:*"
    vitruv:
      patterns:
      - "tools.vitruv:*"
