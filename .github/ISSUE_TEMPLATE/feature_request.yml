name: Feature request
description: Suggest an improvement for the NeoJoin language, CLI or language server
type: Feature
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today, or what is hard to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? An example (query, command, API call) helps.
    validations:
      required: true
