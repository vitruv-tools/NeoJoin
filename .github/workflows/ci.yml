name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
    - main
  schedule:
  - cron: "0 2 * * *"

jobs:
  build-maven:
    name: Build Maven projects
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1

    - name: Setup Java and Maven cache
      uses: actions/setup-java@v6.1.0
      with:
        distribution: 'temurin'
        java-version: '21'
        check-latest: true
        cache: 'maven'

    - name: Build projects
      run: >
        ./mvnw clean verify
        --batch-mode
        --fail-at-end
        --update-snapshots
        --no-transfer-progress

    - name: Stage build results
      run: mkdir staging && find . -path '*/target/*/*' -prune -o -path '*/target/*.jar' -exec cp {} staging/ \;

    - name: Upload build results
      uses: actions/upload-artifact@v7
      with:
        name: framework-and-cli
        path: staging/

  checkstyle:
    name: Checkstyle
    runs-on: ubuntu-latest
    needs: build-maven

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1

    - name: Setup Java and Maven cache
      uses: actions/setup-java@v6.1.0
      with:
        distribution: 'temurin'
        java-version: '21'
        check-latest: true
        cache: 'maven'

    # Violations are warnings and do not fail the job (see the profile "checkstyle" in pom.xml).
    - name: Check code style
      run: >
        ./mvnw validate -P checkstyle
        --batch-mode
        --update-snapshots
        --no-transfer-progress

  build-maven-other-platforms:
    name: Build Maven projects
    runs-on: ${{ matrix.os }}
    needs: build-maven
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1

    - name: Setup Java and Maven cache
      uses: actions/setup-java@v6.1.0
      with:
        distribution: 'temurin'
        java-version: '21'
        check-latest: true
        cache: 'maven'

    - name: Build projects
      run: >
        ./mvnw clean verify
        --batch-mode
        --fail-at-end
        --update-snapshots
        --no-transfer-progress

  sonar:
    name: SonarQube scan of Maven projects
    if: github.event_name == 'schedule' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    needs: build-maven

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0

    - name: Setup Java and Maven cache
      uses: actions/setup-java@v6.1.0
      with:
        distribution: 'temurin'
        java-version: '21'
        check-latest: true
        cache: 'maven'

    - name: Setup SonarQube cache
      uses: actions/cache@v6
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Analyze projects
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: >
        ./mvnw clean verify sonar:sonar -P coverage
        --batch-mode
        --update-snapshots
        --no-transfer-progress
        -Dsonar.projectKey=vitruv-tools_NeoJoin
